; Knee pod firmware, two boards with one codebase.
;   thigh: master. Own MPU6050, merges shank packets, PSRAM ring, SD (.kbx), TFLM, UI.
;   shank: slave. Own MPU6050 at 50 Hz, sends sequenced ESP-NOW responses.
; Build both: pio run -e thigh -e shank

[platformio]
default_envs = thigh
include_dir = include
lib_dir = lib

[env]
platform = espressif32
board = lolin_s3_mini
framework = arduino
board_build.partitions = partitions.csv
; ESP32-S3FH4R2 has 2 MB quad PSRAM and 4 MB quad flash.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -Iinclude
    -Isrc

[env:thigh]
build_src_filter = +<*> -<main_shank.cpp>
build_flags =
    ${env.build_flags}
    -DPOD_ROLE_THIGH=1
lib_deps =
    ; Versions are pinned here and recorded in BUILD_SIZES.md after a real build.
    espressif/esp-tflite-micro@1.3.1

[env:shank]
build_src_filter = +<*> -<main_thigh.cpp> -<infer.cpp> -<sd_writer.cpp>
build_flags =
    ${env.build_flags}
    -DPOD_ROLE_SHANK=1
